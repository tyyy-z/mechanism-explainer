const STEPS = [
  { id: 'system', view: 'sys', scope: 'pwr', vis: {}, cfg: { ped: .6, rpm: 3000 }, op: 'LAUNCH', rows: ['r-ped', 'r-rpm', 'r-vdc'],
    title: B('Battery to wheels', '从电池到车轮'), sub: B('DC → inverter → 3-phase AC → motor → 9:1 gearbox', '直流 → 逆变器 → 三相交流 → 电机 → 9:1 减速器'),

  { id: 'inverter', view: 'inv', scope: 'iabc', vis: { pcb: 0, housing: .15, capCut: 1 }, cfg: { ped: .5, rpm: 2000 }, op: 'PWM', rows: ['r-ped', 'r-rpm', 'r-vdc'],
    title: B('The SiC inverter', '碳化硅逆变器'), sub: B('3 half-bridges × 4 parallel MOSFET modules, film DC-link', '3 个半桥 × 4 个并联 MOSFET 模块，薄膜直流母线电容'),
    why: B('<p>Each phase has a <b>half-bridge</b>: a high-side and a low-side switch. Here every switch position is <b>4 SiC MOSFET modules in parallel</b>, 24 in total, sitting on a pin-fin <b>cold plate</b> with glycol underneath.</p><p>The switches toggle at ~10 kHz. By varying the on-time (<b>PWM</b>) the average phase voltage follows a sine wave; the motor inductance smooths the current. The <b>film DC-link capacitor</b> supplies the ripple current so the battery cable does not have to.</p>', '<p>每一相是一个<b>半桥</b>：上管和下管。这里每个开关位置由 <b>4 个碳化硅 MOSFET 模块并联</b>，共 24 个，贴在带针翅的<b>冷板</b>上，下面走冷却液。</p><p>开关频率约 10 kHz。改变导通时间（<b>PWM</b>）让平均相电压跟随正弦，电机电感把电流平滑。<b>薄膜直流母线电容</b>负责纹波电流，免得电池线缆承担。</p>'),
    math: B('$$d_{a,b,c} = \\tfrac12 + \\frac{v_{a,b,c} + v_0}{V_{dc}},\\quad v_0 = -\\tfrac12(\\max+\\min)$$<p>Min–max injection (≈ SVPWM) gives 15 % more usable voltage than plain sine PWM: V<sub>max</sub> = V<sub>dc</sub>/√3.</p>', '$$d_{a,b,c} = \\tfrac12 + \\frac{v_{a,b,c} + v_0}{V_{dc}},\\quad v_0 = -\\tfrac12(\\max+\\min)$$<p>最大–最小注入（≈ SVPWM）比普通正弦 PWM 多 15% 可用电压：V<sub>max</sub> = V<sub>dc</sub>/√3。</p>'),

    quiz: { q: B('Why are 4 modules placed in parallel per switch?', '为什么每个开关要并联 4 个模块？'), opts: [B('To share hundreds of amps and the heat', '分担数百安电流和发热'), B('To raise the voltage', '提高电压'), B('For redundancy only', '仅为冗余')], a: 0, fb: B('Yes — peak phase current is several hundred amps.', '对——相电流峰值达数百安。') },
    src: ['inv', 'foc', 'cap'] },
  { id: 'stator', view: 'stator', scope: 'iabc', vis: { housing: 0, inv: 0, rotor: 0, brg: 0, resolver: 0 }, cfg: { ped: .5, rpm: 600 }, op: 'FIELD', rows: ['r-ped', 'r-rpm'],
    title: B('Hairpin stator', '发卡绕组定子'), sub: B('54 slots, rectangular copper pins, rotating field', '54 槽，矩形铜线，旋转磁场'),
    why: B('<p>The stator is a stack of thin steel laminations with <b>54 slots</b>. Instead of round wire, it uses <b>hairpins</b>: U-shaped rectangular copper bars pushed in from one end (the <b>crown</b>), then twisted and <b>laser-welded</b> in pairs at the other end. Rectangular copper fills the slot better, so resistance and heat drop.</p><p>Three phase currents 120° apart in space and time add up to a magnetic field that <b>rotates</b> at the electrical frequency ÷ 3 pole pairs.</p>', '<p>定子由薄硅钢片叠成，有 <b>54 个槽</b>。它不用圆线，而用<b>发卡</b>：U 形矩形铜条从一端（<b>发卡头</b>）插入，另一端扭转后成对<b>激光焊接</b>。矩形铜填满槽，电阻和发热更低。</p><p>空间和时间上互差 120° 的三相电流，合成一个以电频率 ÷ 3 对极<b>旋转</b>的磁场。</p>'),
    math: B('$$\\mathbf{F}(\\theta,t) = \\tfrac32 F_m \\cos(p\\theta - \\omega_e t)$$<p>q = 54 / (6 × 3) = 3 slots per pole per phase.</p>', '$$\\mathbf{F}(\\theta,t) = \\tfrac32 F_m \\cos(p\\theta - \\omega_e t)$$<p>每极每相槽数 q = 54 / (6 × 3) = 3。</p>'),
    try: B('<p>Drag <b>Motor speed</b> down to a few hundred rpm and watch the three currents on the scope: their sum is always zero.</p>', '<p>把<b>电机转速</b>拖到几百 rpm，观察示波器上的三相电流：三者之和恒为零。</p>'),
    quiz: { q: B('Why are hairpins welded only at one end?', '为什么发卡只在一端焊接？'), opts: [B('The other end is a continuous U-bend (the crown)', '另一端是连续的 U 形弯（发卡头）'), B('To save weld time only', '只为省焊接时间'), B('The crown carries no current', '发卡头不通电')], a: 0, fb: B('Exactly — each pin is one U, so only the open legs need joining.', '没错——每根发卡是一个 U，只需连接开口的两条腿。') },
    src: ['mxp', 'pem'] },
  { id: 'rotor', view: 'rotor', scope: 'dq', vis: { housing: 0, inv: 0, stator: 0, resolver: 0 }, cfg: { ped: 1, rpm: 1500 }, op: 'ANGLE', rows: ['r-ped', 'r-rpm', 'r-mode'],
    title: B('IPM rotor: two torques', '内置永磁转子：两种扭矩'), sub: B('V-shaped magnets + reluctance (Ld < Lq), MTPA angle', 'V 形磁钢 + 磁阻扭矩（Ld < Lq），MTPA 角'),
    why: B('<p>The rotor buries NdFeB magnets in <b>V-shaped pockets</b>, 6 poles, each magnet split into 4 segments to cut eddy losses. Burying them makes the rotor easier to magnetise across the poles (q-axis) than through the magnets (d-axis): <b>L<sub>d</sub> &lt; L<sub>q</sub></b>.</p><p>So torque has two parts: <b>magnet torque</b> from i<sub>q</sub>, and <b>reluctance torque</b> when you also push negative i<sub>d</sub>. Advancing the current angle ~50° (<b>MTPA</b>) gives more torque per amp than i<sub>d</sub> = 0.</p>', '<p>转子把钕铁硼磁钢埋在 <b>V 形槽</b>里，6 极，每块磁钢分 4 段以降低涡流损耗。埋入后，转子沿极间（q 轴）比穿过磁钢（d 轴）更容易磁化：<b>L<sub>d</sub> &lt; L<sub>q</sub></b>。</p><p>于是扭矩有两部分：i<sub>q</sub> 产生的<b>永磁扭矩</b>，以及加入负 i<sub>d</sub> 时的<b>磁阻扭矩</b>。电流角超前约 50°（<b>MTPA</b>）比 i<sub>d</sub> = 0 每安培扭矩更大。</p>'),
    math: B('$$T = \\tfrac32 p\\,[\\lambda_m i_q + (L_d - L_q)\\, i_d i_q]$$<p>p = 3, λ<sub>m</sub> from 42 V<sub>pk</sub>/krpm. L<sub>d</sub> = 0.10 mH, L<sub>q</sub> = 0.20 mH are illustrative fits.</p>', '$$T = \\tfrac32 p\\,[\\lambda_m i_q + (L_d - L_q)\\, i_d i_q]$$<p>p = 3，λ<sub>m</sub> 由 42 V<sub>pk</sub>/krpm 求得。L<sub>d</sub> = 0.10 mH、L<sub>q</sub> = 0.20 mH 为示意拟合值。</p>'),
    try: B('<p>Switch <b>Current angle</b> between MTPA and i<sub>d</sub> = 0 at full pedal. Same current, less torque without the reluctance part.</p>', '<p>全踏板下在 MTPA 和 i<sub>d</sub> = 0 之间切换<b>电流角</b>。同样电流，没有磁阻部分扭矩更小。</p>'),
    quiz: { q: B('Reluctance torque needs…', '磁阻扭矩需要……'), opts: [B('Ld = Lq', 'Ld = Lq'), B('Ld ≠ Lq and a non-zero i_d', 'Ld ≠ Lq 且 i_d 不为零'), B('No magnets at all', '完全没有磁钢')], a: 1, fb: B('Yes — saliency plus d-axis current.', '对——凸极性加 d 轴电流。') },
    src: ['mxp', 'ipm'] },
  { id: 'foc', view: 'res', scope: 'dq', vis: { housing: 0, inv: 0, stator: 0, brg: 0, rotor: .0 }, cfg: { ped: .7, rpm: 5000 }, op: 'STEP', rows: ['r-ped', 'r-rpm', 'r-mode'],
    title: B('Field-oriented control', '磁场定向控制'), sub: B('Resolver → Clarke/Park → PI on i_d, i_q → SVPWM', '旋变 → Clarke/Park → i_d、i_q 的 PI → SVPWM'),
    why: B('<p>The controller must know where the magnets are. A <b>variable-reluctance resolver</b> at the shaft end does it: an excitation coil and sin/cos pick-up coils around a 3-lobed steel rotor give the angle with no electronics on the shaft.</p><p>With that angle the MCU rotates the measured currents into the rotor frame (<b>Park transform</b>), where AC becomes two DC values, i<sub>d</sub> and i<sub>q</sub>. Two PI loops hold them at the torque request, then the result is rotated back and sent to SVPWM — 10,000 times a second.</p>', '<p>控制器必须知道磁钢在哪。轴端的<b>磁阻式旋转变压器</b>负责：励磁线圈和正弦/余弦线圈围着 3 凸瓣钢转子，不在轴上放任何电子元件就能给出角度。</p><p>有了角度，MCU 把测得的电流转到转子坐标系（<b>Park 变换</b>），交流变成两个直流量 i<sub>d</sub>、i<sub>q</sub>。两个 PI 环把它们稳在扭矩指令上，再反变换送给 SVPWM——每秒一万次。</p>'),
    math: B('$$\\begin{bmatrix} i_d\\\\ i_q \\end{bmatrix} = \\begin{bmatrix} \\cos\\theta_e & \\sin\\theta_e\\\\ -\\sin\\theta_e & \\cos\\theta_e \\end{bmatrix} \\begin{bmatrix} i_\\alpha\\\\ i_\\beta \\end{bmatrix},\\ \\theta_e = p\\,\\theta_m$$', '$$\\begin{bmatrix} i_d\\\\ i_q \\end{bmatrix} = \\begin{bmatrix} \\cos\\theta_e & \\sin\\theta_e\\\\ -\\sin\\theta_e & \\cos\\theta_e \\end{bmatrix} \\begin{bmatrix} i_\\alpha\\\\ i_\\beta \\end{bmatrix},\\ \\theta_e = p\\,\\theta_m$$'),
    try: B('<p>Press <b>Run</b> for a pedal step: the dq vector jumps to the new torque curve while the phase currents just change amplitude.</p>', '<p>点<b>运行</b>做一次踏板阶跃：dq 矢量跳到新的恒扭矩曲线，而相电流只是幅值变化。</p>'),
    quiz: { q: B('Why control in the rotor (dq) frame?', '为什么在转子（dq）坐标系里控制？'), opts: [B('Currents become DC, so simple PI loops work', '电流变成直流，简单 PI 就能用'), B('It removes the need for a sensor', '可以省掉传感器'), B('It doubles the voltage', '电压翻倍')], a: 0, fb: B('Right — tracking DC values is easy; tracking a fast sine is not.', '对——跟踪直流量容易，跟踪高速正弦难。') },
    src: ['foc', 'inv', 'res'] },
  { id: 'fw', view: 'sys', scope: 'ts', vis: { housing: .15 }, cfg: { ped: 1, rpm: 9000 }, op: 'SWEEP', rows: ['r-ped', 'r-rpm', 'r-vdc'],
    title: B('Torque–speed and field weakening', '扭矩–转速与弱磁'), sub: B('Base speed, voltage ellipse, 200 kW cap', '基速、电压椭圆、200 kW 上限'),
    why: B('<p>Back-EMF rises with speed. Above <b>base speed</b> (~4,500 rpm here) the inverter runs out of voltage. The controller then pushes more <b>negative i<sub>d</sub></b> to cancel part of the magnet flux — <b>field weakening</b> — trading torque for speed.</p><p>The power electronics and battery also cap power near 200 kW, so torque falls roughly as 1/speed up to ~18,000 rpm.</p>', '<p>反电动势随转速升高。超过<b>基速</b>（这里约 4500 rpm）逆变器电压不够。控制器就加大<b>负 i<sub>d</sub></b>，抵消部分磁钢磁通——<b>弱磁</b>——用扭矩换转速。</p><p>功率电子和电池还把功率限制在约 200 kW，所以扭矩大致按 1/转速 下降，直到约 18000 rpm。</p>'),
    math: B('$$ (L_q i_q)^2 + (L_d i_d + \\lambda_m)^2 \\le \\left(\\frac{V_{dc}}{\\sqrt3\\,\\omega_e}\\right)^2 $$<p>The voltage-limit ellipse shrinks as ω<sub>e</sub> grows; the operating point must stay inside both it and the current circle.</p>', '$$ (L_q i_q)^2 + (L_d i_d + \\lambda_m)^2 \\le \\left(\\frac{V_{dc}}{\\sqrt3\\,\\omega_e}\\right)^2 $$<p>电压极限椭圆随 ω<sub>e</sub> 增大而缩小；工作点必须同时在椭圆和电流圆内。</p>'),
    try: B('<p>Lower the battery to 300 V and watch base speed move left on the torque–speed scope.</p>', '<p>把电池降到 300 V，看扭矩–转速图上基速向左移动。</p>'),
    quiz: { q: B('Field weakening works by…', '弱磁的原理是……'), opts: [B('Heating the magnets', '加热磁钢'), B('Negative d-axis current opposing the magnet flux', '负 d 轴电流抵消磁钢磁通'), B('Raising the battery voltage', '提高电池电压')], a: 1, fb: B('Correct — no physical change to the magnets.', '正确——磁钢本身没有物理变化。') },
    src: ['mxp', 'foc', 'epa'] },
  { id: 'regen', view: 'cap', scope: 'pwr', vis: { pcb: 0, capCut: 1 }, cfg: { ped: -.5, rpm: 8000 }, op: 'REGEN', rows: ['r-ped', 'r-rpm', 'r-vdc'],
    title: B('Regen and losses', '能量回馈与损耗'), sub: B('Negative i_q, power back to the battery', '负 i_q，功率回到电池'),
    why: B('<p>Lift off the pedal and the controller simply asks for <b>negative i<sub>q</sub></b>. Torque reverses, the motor brakes the car, and the inverter now rectifies: current flows back through the DC-link into the battery.</p><p>Losses never vanish: copper (I²R), iron (eddy + hysteresis, rising with frequency), switching and conduction losses in the SiC, and gear mesh. They end up in the coolant loop.</p>', '<p>松开踏板，控制器只需给出<b>负 i<sub>q</sub></b>。扭矩反向，电机制动车辆，逆变器转为整流：电流经直流母线流回电池。</p><p>损耗不会消失：铜损（I²R）、铁损（涡流 + 磁滞，随频率增加）、碳化硅的开关和导通损耗、齿轮啮合损耗，最后都进入冷却回路。</p>'),
    math: B('$$P_{batt} = P_{shaft}\\,\\eta_{m}\\eta_{inv}\\ (\\text{regen}),\\qquad P_{cu} = \\tfrac32 R_s I^2$$<p>R<sub>s</sub> = 4.75 mΩ per phase; efficiencies here are illustrative.</p>', '$$P_{batt} = P_{shaft}\\,\\eta_{m}\\eta_{inv}\\ (\\text{回馈}),\\qquad P_{cu} = \\tfrac32 R_s I^2$$<p>每相 R<sub>s</sub> = 4.75 mΩ；此处效率为示意。</p>'),
    try: B('<p>Drag the pedal below zero. The power-flow arrows reverse and the dot on the torque–speed map drops below the axis.</p>', '<p>把踏板拖到零以下。功率流箭头反向，扭矩–转速图上的圆点落到横轴下方。</p>'),

let AUTOPLAY = !INTERACTIVE_START, LT = 0, EVI = 0, EVLAST = 0, VIEW = 'sys';
const VIS = { housing: 1, inv: 1, rotorOut: 0 }; let RO = 0;
function userTook() { if (AUTOPLAY) { AUTOPLAY = false; syncControls(); } }
// ---------- demo ops ----------
const OPR = { running: false, kind: '', t0: 0, dur: 1 };
const OPS = {
  LAUNCH: { dur: 9, f: k => { DRV.ped = 1; DRV.rpm = Math.round(18000 * smooth(k) / 100) * 100; } },
  PWM: { dur: 6, f: k => { DRV.rpm = Math.round(lerp(300, 7000, k) / 100) * 100; } },
  FIELD: { dur: 6, f: k => { DRV.rpm = Math.round(lerp(60, 1200, k) / 10) * 10; } },
  ANGLE: { dur: 7.5, f: k => { DRV.ped = 1; DRV.mode = k < .33 || k > .66 ? 'mtpa' : 'id0'; } },
  STEP: { dur: 5, f: k => { DRV.ped = k < .25 ? .2 : 1; } },
  SWEEP: { dur: 10, f: k => { DRV.ped = 1; DRV.rpm = Math.round(18000 * k / 100) * 100; } },
  REGEN: { dur: 7, f: k => { DRV.ped = k < .2 ? .6 : lerp(.6, -.6, clamp((k - .2) / .2)); DRV.rpm = Math.round(lerp(9000, 2500, smooth(clamp((k - .3) / .7))) / 100) * 100; } },
};
function startOp(kind) { OPR.running = true; OPR.kind = kind; OPR.t0 = SIM.t; OPR.dur = OPS[kind].dur; }
function abortOp() { OPR.running = false; }
function tickOp() { if (!OPR.running) return; const k = clamp((SIM.t - OPR.t0) / OPR.dur); OPS[OPR.kind].f(k); solveOP(); syncControls.dirty = true; if (k >= 1) { OPR.running = false; onOpDone(); syncControls(); } }
function onOpDone() {
  const m = {
    LAUNCH: B(`Top speed ${fmt(kmh(18000), 0)} km/h at 18,000 rpm; power capped at 200 kW`, `18000 rpm 对应 ${fmt(kmh(18000), 0)} km/h；功率封顶 200 kW`),
    PWM: B('Higher speed → higher back-EMF → wider PWM duty swing', '转速越高 → 反电动势越大 → PWM 占空比摆幅越大'),
    FIELD: B('Three currents, 120° apart, always summing to zero', '三相电流互差 120°，总和恒为零'),
    ANGLE: B('MTPA adds reluctance torque: more N·m from the same amps', 'MTPA 加入磁阻扭矩：同样电流得到更多扭矩'),
    STEP: B('The dq vector jumped to the new torque curve', 'dq 矢量跳到了新的恒扭矩曲线'),
    SWEEP: B('Past base speed the current angle advances: field weakening', '超过基速后电流角超前：弱磁'),
    REGEN: B(`Regen: ${kW(-OP.Pb)} back into the battery`, `回馈：${kW(-OP.Pb)} 回到电池`),
  }[OPR.kind]; if (m) toast(tr(m));
}
// ---------- steps ----------
function applyVis(v) {
  const g = k => v[k] == null ? 1 : v[k];
  GRP.housing.visible = g('housing') > 0 && VIS.housing; GRP.inv.visible = g('inv') > 0 && VIS.inv; GRP.stator.visible = g('stator') > 0; GRP.rotor.visible = g('rotor') > 0;
  GRP.resolver.visible = g('resolver') > 0; GRP.brg.visible = g('brg') > 0; GRP.pcb.visible = g('pcb') > 0;
  const cut = !!v.capCut; GRP.capCase.visible = GRP.capLbl.visible = !cut; for (const e of GRP.capElems) e.visible = cut;
}
function goStep(i, dur = 1.7) {
  i = clamp(i, 0, STEPS.length - 1); if (OPR.running) abortOp();
  CUR = i; const s = STEPS[i]; SCOPE = s.scope; WHYTAB = 'why'; hideTip();
  if (toast.until) { $('toast').style.opacity = 0; toast.until = 0; TOASTRECT = null; }
  Object.assign(DRV, { mode: 'mtpa' }, s.cfg); VIS.housing = 1; VIS.inv = 1; VIS.rotorOut = 0; applyVis(s.vis); syncViewBtns();
  VIEW = s.view; shot(SHOTS[s.view], dur); solveOP();
  renderStepTitle(); renderTrail(); renderWhy(); syncControls(); updateReadouts(); sizeScope();
}
function renderStepTitle() { const s = STEPS[CUR]; $('steptitle').innerHTML = `<span class="ix">${String(CUR + 1).padStart(2, '0')} / ${String(STEPS.length).padStart(2, '0')}</span>${tr(s.title)}<small>${tr(s.sub)}</small>`; }
LANGHOOKS.push(() => { renderStepTitle(); renderTrail(); renderWhy(); ro.last = ''; updateReadouts(); syncControls(); layout(); updateTip.last = ''; updateTip(); });
function syncViewBtns() { $('btnHousing').classList.toggle('on', !!VIS.housing && GRP.housing.visible); $('btnInv').classList.toggle('on', !!VIS.inv && GRP.inv.visible); $('btnRotorOut').classList.toggle('on', !!VIS.rotorOut); }
$('btnHousing').addEventListener('click', () => { userTook(); VIS.housing = GRP.housing.visible ? 0 : 1; GRP.housing.visible = !!VIS.housing; syncViewBtns(); });
$('btnInv').addEventListener('click', () => { userTook(); VIS.inv = GRP.inv.visible ? 0 : 1; GRP.inv.visible = !!VIS.inv; syncViewBtns(); });
$('btnRotorOut').addEventListener('click', () => { userTook(); VIS.rotorOut = VIS.rotorOut ? 0 : 1; if (VIS.rotorOut) { GRP.rotor.visible = true; GRP.housing.visible = false; } syncViewBtns(); });
$('btnReset').addEventListener('click', () => { userTook(); user.daz = user.del = 0; user.zoom = 1; shot(SHOTS[VIEW], 1.2); });
// ---------- autoplay ----------
const idle = () => !OPR.running;
const TL = [[0.0, () => goStep(0, 0)], [0.8, () => startOp(STEPS[0].op)], [0.2, idle]];
for (let i = 1; i < STEPS.length; i++) TL.push([1.6, () => goStep(i)], [1.0, () => startOp(STEPS[i].op)], [0.2, idle]);
TL.push([1.4, () => { WHYTAB = 'src'; renderWhy(); }], [1.6, () => { userTook(); toast(LANG === 'zh' ? '自动演示结束——现在可以自由操作：点步骤、拖动滑块、点任意部件。' : 'Tour finished — explore freely: click steps, drag sliders, click any part.', 6000); }]);
function tickAuto(dt) { LT += dt; while (EVI < TL.length && LT - EVLAST >= TL[EVI][0]) { const r = TL[EVI][1](); if (r === false) break; EVLAST = LT; EVI++; } }
function restartAutoplay() { abortOp(); AUTOPLAY = true; LT = 0; EVI = 0; EVLAST = 0; user.daz = user.del = 0; user.zoom = 1; syncControls(); }
// ---------- labels ----------
const LBL = [
  ['stator', [-1, 10.6, 7.2], ['sys', 'stator']], ['winding', [-9.6, 6.5, 5.5], ['stator']], ['rotor', [7.4, 4.2, 4.2], ['rotor', 'lam']], ['resolver', [-11.6, 4.4, 1.5], ['res']],
  ['inv', [-1.2, 15.4, -6.6], ['inv', 'sys']], ['cap', [10.8, 18.6, 1.6], ['cap', 'inv']], ['housing', [0, -11.8, 8], ['sys']], ['brg', [-9.4, 5.6, 0], ['rotor']],
].map(([id, p, views]) => ({ id, views, L: label(INFO[id].name, V3(...p), { pri: 2 }) }));
// pickables
for (const k of Object.keys(INFO)) { const g = GRP[k]; if (!g) continue; (g.traverse ? g : null)?.traverse(o => { if (o.isMesh) pickable(o, INFO[k]); }); }
// ---------- scene update ----------
const VISR = 1 / 150; // display: 18,000 rpm → 2 rev/s
function sceneUpdate(dt) {
  const w = DRV.rpm / 60 * TAU; DRV.th += w * EV.p * dt * (OPR.kind === 'FIELD' || DRV.rpm < 1500 ? .05 : .004);
  GRP.rotor.rotation.z += w * VISR * dt; GRP.resRotor.rotation.z = GRP.rotor.rotation.z;
  RO = damp(RO, VIS.rotorOut, 4, dt); GRP.rotor.position.z = RO * 24; if (RO > .02) GRP.rotor.visible = true;
  for (const l of LBL) l.L.show = l.views.includes(VIEW) && visibleUp(GRP[l.id]) ? .9 : 0;
  const tk = OPR.running ? `<b>${tr(RUNLAB[OPR.kind])}</b> · ${fmt(OP.T, 0)} N·m · ${fmt(DRV.rpm, 0)} rpm` : `<b>${t('ready')}</b>`;
  if (tk !== sceneUpdate.tk) { $('tkphase').innerHTML = tk; sceneUpdate.tk = tk; }
}
function simStep(dt) {
  SIM.t += dt; if (AUTOPLAY) tickAuto(dt); tickOp(dt);
  tickExplode(); updateRig(); sceneUpdate(dt); tickToast();
}
let FR = 0;
function render() {
  placeCamera(); camera.updateMatrixWorld(); updateLabels();
  renderer.setScissorTest(false); renderer.clear(); const sx = stageOX + STAGE.x * stageScale, sy = VH - (stageOY + (STAGE.y + STAGE.h) * stageScale); renderer.setScissor(sx + 1, sy + 1, STAGE.w * stageScale - 2, STAGE.h * stageScale - 2); renderer.setScissorTest(true);
  renderer.render(scene, camera);
  if (CAPTURE || FR % 2 === 0) drawScope(); if (CAPTURE || FR % 6 === 0) { updateReadouts(); if (syncControls.dirty) { syncControls(); syncControls.dirty = false; } } updateTip(); FR++;
}
// ---------- input ----------
const ray = new THREE.Raycaster(); let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY; if (drag.moved > 4) { userTook(); user.daz -= dx * .006; user.del = clamp(user.del + dy * .004, -1.2, 1.2); } });
canvas.addEventListener('pointerup', e => { const d = drag; drag = null; if (!d || d.moved > 4) return; pickAt(e.clientX, e.clientY); });
canvas.addEventListener('wheel', e => { e.preventDefault(); userTook(); user.zoom = clamp(user.zoom * Math.exp(e.deltaY * .0012), .3, 2.5); }, { passive: false });
function pickAt(cx, cy) {
  ray.setFromCamera(new THREE.Vector2(cx / VW * 2 - 1, -(cy / VH) * 2 + 1), camera);
  const hits = ray.intersectObjects(PICK.filter(visibleUp), false).filter(h => !(h.object.material === alCast));
  if (!hits.length) { hideTip(); return; }
  userTook(); showTip(hits[0].object.userData.info, (cx - stageOX) / stageScale, (cy - stageOY) / stageScale);
}
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') { userTook(); goStep(CUR + 1); } else if (e.key === 'ArrowLeft') { userTook(); goStep(CUR - 1); } else if (e.key === 'Escape') hideTip(); });
addEventListener('resize', () => { layout(); sizeScope(); });
new ResizeObserver(() => { sizeScope(); drawScope(); }).observe(sc);
// ---------- boot ----------
PART.mesh.visible = false;
applyLang(); layout(); sizeScope(); envFor(350);
if (AUTOPLAY) restartAutoplay();
goStep(0, 0);
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame); if (CAPTURE) return;
  const el = Math.min(.1, (now - last) / 1000); last = now;
  if (!SIM.paused) { acc += el * SIM.speed; let n = 0; while (acc >= SIM.dt && n < 8) { simStep(SIM.dt); acc -= SIM.dt; n++; } if (n === 8) acc = 0; }
  render();
}
requestAnimationFrame(frame);
// ---------- test hooks ----------
window.__setTime = t => { let n = 0; while (SIM.t + SIM.dt / 2 < t && n < 200000) { simStep(SIM.dt); n++; } render(); return SIM.t; };
window.__state = () => ({ t: SIM.t, step: CUR, view: VIEW, op: OPR.kind, running: OPR.running, auto: AUTOPLAY, ev: EVI, nEv: TL.length, lang: LANG, drv: Object.assign({}, DRV), op_: { T: OP.T, P: OP.P, I: OP.I, beta: OP.beta, fw: OP.fw, Pb: OP.Pb } });
window.__goStep = i => goStep(i);
window.__setLang = l => { setLang(l); render(); return LANG; };
window.__scopeInfo = () => ({ scope: SCOPE, running: OPR.running });
window.__perf = () => { render(); const i = renderer.info; return { calls: i.render.calls, tris: i.render.triangles, textures: i.memory.textures, geometries: i.memory.geometries, texMB: +(Object.values(TX).reduce((a, tx) => a + (tx && tx.image ? (tx.image.width * tx.image.height * 4 * 1.33) : 0), 0) / 1048576).toFixed(1) }; };
window.__layout = () => { const r = []; for (const L of LABELS) if (L.el.style.visibility === 'visible' && +L.el.style.opacity > .05) { const b = L.el.getBoundingClientRect(); r.push({ t: L.el.textContent.slice(0, 30), x0: b.left, y0: b.top, x1: b.right, y1: b.bottom }); } return { labels: r }; };
window.I18N = I18N;
window.__dbg = { DRV, OP, GRP, OPR };
{ const m = QS.match(/[?&]step=(\d+)/); if (m) goStep(Math.min(STEPS.length - 1, +m[1]), 0); }
window.__ready = true;

</script>
